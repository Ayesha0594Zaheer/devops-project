name: Development CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - '**.js'
      - '**.html'
      - '**.css'
      - '.github/workflows/dev-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint

      - name: Run Build
        run: npm run build
